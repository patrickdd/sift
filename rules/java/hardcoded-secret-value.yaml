# Original rule written for sift; not derived from the Semgrep registry.
rules:
  - id: java.hardcoded-secret-value
    languages: [java]
    severity: ERROR
    message: >-
      '$F' looks like a credential and has a hard-coded value. Load it from the
      environment or a secret store without a literal fallback.
    metadata:
      cwe: "CWE-798"
      category: secret
    pattern-either:
      # @Value("${prop:default}") with a non-empty default on a secret-named field
      - patterns:
          - pattern: |
              @Value($EXPR)
              $T $F;
          - metavariable-regex:
              metavariable: $EXPR
              regex: ^"\$\{[^:}]+:[^}]+\}"$
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(key|secret|password|passwd|pwd|token)$
      # String literal assigned to a secret-named field or variable
      - patterns:
          - pattern-either:
              - pattern: $T $F = "$LIT";
              - pattern: $F = "$LIT";
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(key|secret|password|passwd|pwd|token)$
          - metavariable-regex:
              metavariable: $LIT
              regex: ^[^\s$]{6,}$
