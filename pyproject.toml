[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "0.1.0"
description = "Deterministic tools find, the LLM triages: static-analysis evidence packets for Claude Code."
readme = "DESIGN.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools]
# rules/ lives at the repo root (the Claude Code plugin uses it there) and ships inside
# the wheel as the `sift.rules` package; only rule YAML and tool configs are packaged,
# not the deliberately vulnerable Semgrep test cases next to them.
package-dir = { "" = "src", "sift.rules" = "rules" }
packages = ["sift", "sift.adapters", "sift.rules"]

[tool.setuptools.package-data]
"sift.rules" = ["families.yaml", "java/*.yaml", "python/*.yaml", "tool-config/*.toml", "tool-config/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 112
# rules/ holds deliberately vulnerable Semgrep test cases; fixtures are tool output.
extend-exclude = ["rules", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
